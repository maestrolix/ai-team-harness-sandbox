name: Harness checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  team-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: docker compose -f harness/compose.yaml config --quiet
