[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-team-harness"
version = "0.2.0"
description = "Диспетчер задач GitHub с изолированными воркерами Codex"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["coverage>=7.6,<8", "pytest>=8,<10", "ruff>=0.11,<1", "build>=1,<2"]

[project.scripts]
harness = "ai_team_harness.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["ai_team_harness"]

[tool.coverage.report]
fail_under = 100
show_missing = true
precision = 2

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
