# Установщик заполняет эти поля по origin, --project и текущему пользователю gh.
repository = "owner/repository"
project_owner = "owner"
project_owner_kind = "user" # Для Project организации: "organization".
project_number = 1
trusted_users = ["owner"] # Чьи комментарии к PR обрабатывать.

# Пути относительно этого конфига. Для наблюдателя нужен отдельный чистый clone.
workspace = "."
state_dir = ".state" # Сохраняйте между перезапусками.
poll_seconds = 60
job_timeout_seconds = 1800 # Лимит запуска Codex; QA дополнительно ограничен инструкциями.
check_timeout_seconds = 300 # Отдельный лимит команды проверки.

# Укажите реальные проверки приложения. Команда запускается без shell.
check_command = [] # Например ["make", "check"]. Без команды изменения не публикуются.
required_checks = [] # Например ["backend", "frontend"]. Без CI jobs PR остаётся Draft.
