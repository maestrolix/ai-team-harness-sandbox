name: ai-team-harness
services:
  observer:
    build:
      context: ..
      dockerfile: harness/Dockerfile
    init: true
    restart: unless-stopped
    command: ["--config", "/config/harness.toml", "--max-jobs", "100000", "--max-seconds", "86400"]
    environment:
      GH_CONFIG_DIR: /gh-config
      GH_TOKEN: ${GH_TOKEN:-}
      PYTHONUNBUFFERED: "1"
    volumes:
      - type: bind
        source: ${HARNESS_CONFIG:-../harness.toml}
        target: /config/harness.toml
        read_only: true
      - type: bind
        source: ${HARNESS_WORKSPACE:-..}
        target: /workspace
      - type: bind
        source: ${HARNESS_GH_CONFIG:-../.state/gh}
        target: /gh-config
        read_only: true
      - type: bind
        source: ${HARNESS_CODEX_AUTH:-../.state/codex-auth.json}
        target: /home/node/.codex/auth.json
      - state:/state
    stop_grace_period: 15s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 2g
    cpus: 2
    # No Docker socket: application environments run separately.
volumes:
  state:
